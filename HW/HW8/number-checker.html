
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HW8 - Number Checker</title>
  
<script>
    // Ask the user to enter a number
    let input = prompt("Enter a number:");

    // Convert the input into a number
    let number = Number(input);

    // Check if the input is valid
    if (input === null || input.trim() === "" || !Number.isFinite(number) || !Number.isInteger(number)) {
        console.log("Invalid input. Please enter a whole number.");
    }
    // Check if the number is even
    else if (number % 2 === 0) {
        console.log(number + " is an even number.");
    }
    // Otherwise, the number is odd
    else {
        console.log(number + " is an odd number.");
    }
</script>

</head>
<body>
    <h1>Even or Odd Number Checker</h1>
    <p>Open the browser console to see the result.</p>
</body>
</html>
